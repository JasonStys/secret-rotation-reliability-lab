name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Require actual selected-Python Tk runtime (no display)
        run: python -I scripts/check_tk_runtime.py
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Native boundary/property/concurrency and maintained docs
        shell: bash
        run: bash scripts/validate.sh
      - run: python -m rotation demo --output out/ci-simulation
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-integration.lock
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Pinned upstream source with reviewed compiler/module security updates
        run: python scripts/build_bao.py
      - name: Official hash-verified scanner binary
        run: |
          python scripts/scanners.py trivy
      - name: Actual installed OpenBao Go-module HIGH/CRITICAL gate
        run: python scripts/bao_check.py
      - name: Actual source-bound non-root database image HIGH/CRITICAL gate
        run: python scripts/image_check.py
      - name: Real TLS grants, renewal, rotation, expiry, outage, token revocation and private audit
        run: python -m scripts.live_drill --output out/live-ci --ack-disposable-docker
      - name: Validate actual complete safe aggregate without uploads
        run: python -m rotation report out/live-ci/report/report.json
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Complete portable/live dependency advisory audit; no exclusions
        run: |
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
          python -m pip_audit -r requirements-integration.lock --disable-pip --no-deps
      - run: |
          python scripts/scanners.py gitleaks
          python scripts/scanners.py actionlint
      - name: Full-history secrets and native workflow/shell checks
        run: |
          .tools/gitleaks git . --redact --no-banner
          .tools/actionlint
          shellcheck scripts/validate.sh ops/start-postgres.sh

  portable-windows:
    name: Windows / actual offline native workbench
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - name: Build actual patched runtime and original notices
        run: python scripts/build_native.py
      - name: Use compiled app controls, independent oracles, export and two-process reopen
        run: python scripts/test_native_app.py
